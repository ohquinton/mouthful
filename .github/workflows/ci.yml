name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs patch-package, so a patch that no longer applies fails here.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
